name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen      # run the PySide6 GUI smoke tests headless
      MPLBACKEND: Agg                 # matplotlib without a display
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: System libraries for headless Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0

      - name: Install (all extras + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      # -rA prints a one-line result for every test; pytest-github-actions-annotate-failures
      # (pulled in by the dev extra) republishes each failure as a job annotation, which is
      # readable without signing in — the run log itself is not.
      - name: Run tests
        run: pytest --cov=gottlux --cov-report=term-missing -rf

  test-windows:
    name: tests (windows, py3.13)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen      # run the PySide6 GUI smoke tests headless
      MPLBACKEND: Agg                 # matplotlib without a display
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install (all extras + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      # -rA prints a one-line result for every test; pytest-github-actions-annotate-failures
      # (pulled in by the dev extra) republishes each failure as a job annotation, which is
      # readable without signing in — the run log itself is not.
      - name: Run tests
        run: pytest --cov=gottlux --cov-report=term-missing -rf

  lint:
    name: lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      # Informational while the existing tree is brought up to style; tighten to blocking
      # (drop continue-on-error) once `ruff format .` has been applied across the codebase.
      - name: ruff check
        continue-on-error: true
        run: ruff check --output-format=github .
      - name: ruff format --check
        continue-on-error: true
        run: ruff format --check .
